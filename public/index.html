<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: bez tego env(safe-area-inset-*) zawsze zwraca 0 na
         iPhone z wcięciem/paskiem gestów — react-native-safe-area-context na
         webie liczy na te zmienne CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#1f6bff" />

    <!-- Uruchomienie z ekranu głównego iOS (Dodaj do ekranu głównego) jako
         samodzielna appka, bez paska adresu Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DUDIE DAY" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Statyczny (czysty HTML/CSS, zero JS) ekran ładowania — #root jest
         PUSTY dopóki nie doładuje się i wykona cały bundle (kilka MB, patrz
         zgłoszenie 2026-08-16 "boisk długo się ładuje" — bez tego użytkownik
         przez ten cały czas patrzy na białą, pustą stronę, zanim React w
         ogóle zdąży zamontować właściwy splash z biegaczem z LoadingRunner,
         patrz src/app/_layout.tsx i src/components/loading-runner.tsx). TEN
         SAM glif (Material Symbols "directions_run", kolor marki) i TE SAME
         DWIE animacje co LoadingRunner (2026-08-17: poprzednia wersja z
         wychyleniem/przechyłem/smugami prędkości naraz była "przekombinowana"
         — uproszczone do dokładnie dwóch: podskok + zamiana nóg odbiciem
         lustrzanym, zsynchronizowane, żeby wyglądało jak bieg, nie
         odbijanie). TEN SAM layout co React splash (logo, potem pod nim
         biegacz) — biegacz ma być ZAWSZE pod logiem DUDIE DAY, nie najpierw
         sam biegacz a dopiero potem logo, więc logo musi być tutaj od razu,
         nie dopiero w React. Logo skopiowane do public/splash-logo.png (nie
         assets/images/ — Expo haszuje nazwy plików z assets/ przy buildzie,
         więc statyczny HTML nie miałby stabilnej ścieżki do niego; pliki w
         public/ Expo kopiuje 1:1 pod tą samą nazwą). Dzięki temu przejście
         do prawdziwego splasha jest niezauważalne, bez mrugnięcia ani
         zmiany layoutu. Znika samo, czysto przez CSS, w chwili gdy React
         cokolwiek wstawi do #root — nie trzeba go usuwać z JS, i zostaje
         widoczne nieprzerwanie aż do tego momentu (nie ma progu
         czasowego/fade-out tutaj celowo). -->
    <style id="static-splash-styles">
      #static-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
      }
      #static-splash-logo {
        width: 340px;
        aspect-ratio: 752 / 509;
        object-fit: contain;
        filter: drop-shadow(0 6px 18px rgba(31, 107, 255, 0.16));
      }
      #root:not(:empty) ~ #static-splash {
        display: none;
      }
      #static-splash-runner {
        margin-top: 28px;
        width: 44px;
        height: 44px;
      }
      #static-splash-shadow {
        margin-top: 6px;
        width: 31px;
        height: 8px;
        border-radius: 999px;
        background: #0a0e16;
        opacity: 0.18;
      }
      /* Dokładnie ta sama animacja co loading-runner.tsx —
         2026-08-17 (druga runda): poprzednie `scaleX(-1)` na CAŁYM glifie
         mirror'owało też głowę/tułów, więc wyglądało jak odwracanie się o
         180°, nie bieg. Głowa+tułów (#static-splash-runner > circle, > .torso)
         są TERAZ statyczne, nigdy się nie ruszają. Rusza się WYŁĄCZNIE para
         noga+ręka — dyskretny (steps(1)) skok między dwiema klatkami wymachu
         (.frame-a / .frame-b), zero ruchu w pionie, zero mirror'owania
         całości. Cień statyczny. */
      #static-splash-runner .frame-a {
        animation: static-splash-frame-a 440ms steps(1) infinite;
      }
      #static-splash-runner .frame-b {
        animation: static-splash-frame-b 440ms steps(1) infinite;
      }
      @keyframes static-splash-frame-a {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      @keyframes static-splash-frame-b {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #static-splash-runner .frame-a,
        #static-splash-runner .frame-b {
          animation: none;
        }
        #static-splash-runner .frame-b {
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="static-splash">
      <img id="static-splash-logo" src="/splash-logo.png" alt="" />
      <svg id="static-splash-runner" viewBox="0 0 48 48">
        <circle cx="31" cy="9" r="5" fill="#1f6bff" />
        <path d="M28 13 L21 27" stroke="#1f6bff" stroke-width="6" stroke-linecap="round" fill="none" />
        <g class="frame-a">
          <path d="M21 27 L29 33 L35 40" stroke="#1f6bff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path d="M21 27 L10 35" stroke="#1f6bff" stroke-width="6" stroke-linecap="round" fill="none" />
          <path d="M28 13 L18 20" stroke="#1f6bff" stroke-width="6" stroke-linecap="round" fill="none" />
          <path d="M28 13 L38 8" stroke="#1f6bff" stroke-width="6" stroke-linecap="round" fill="none" />
        </g>
        <g class="frame-b">
          <path d="M21 27 L25 32 L27 39" stroke="#1f6bff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path d="M21 27 L15 31" stroke="#1f6bff" stroke-width="6" stroke-linecap="round" fill="none" />
          <path d="M28 13 L22 17" stroke="#1f6bff" stroke-width="6" stroke-linecap="round" fill="none" />
          <path d="M28 13 L33 10" stroke="#1f6bff" stroke-width="6" stroke-linecap="round" fill="none" />
        </g>
      </svg>
      <div id="static-splash-shadow"></div>
    </div>
  </body>
</html>
