<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: bez tego env(safe-area-inset-*) zawsze zwraca 0 na
         iPhone z wcięciem/paskiem gestów — react-native-safe-area-context na
         webie liczy na te zmienne CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#1f6bff" />

    <!-- Uruchomienie z ekranu głównego iOS (Dodaj do ekranu głównego) jako
         samodzielna appka, bez paska adresu Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DUDIE DAY" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Statyczny (czysty HTML/CSS, zero JS) ekran ładowania — #root jest
         PUSTY dopóki nie doładuje się i wykona cały bundle (kilka MB, patrz
         zgłoszenie 2026-08-16 "boisk długo się ładuje" — bez tego użytkownik
         przez ten cały czas patrzy na białą, pustą stronę, zanim React w
         ogóle zdąży zamontować właściwy splash z biegaczem z LoadingRunner,
         patrz src/app/_layout.tsx i src/components/loading-runner.tsx). TEN
         SAM rysunek (prosta sylwetka biegacza, kolor marki) i TA SAMA
         animacja co LoadingRunner (2026-08-17, siódma runda: głowa+tułów
         statyczne, nogi/ręce PŁYNNIE tweenowane tam i z powrotem między
         dwiema pozycjami biegu — patrz komentarz przy #static-splash-runner
         niżej i loading-runner.tsx). TEN SAM layout co React splash (logo, potem pod nim
         biegacz) — biegacz ma być ZAWSZE pod logiem DUDIE DAY, nie najpierw
         sam biegacz a dopiero potem logo, więc logo musi być tutaj od razu,
         nie dopiero w React. Logo skopiowane do public/splash-logo.png (nie
         assets/images/ — Expo haszuje nazwy plików z assets/ przy buildzie,
         więc statyczny HTML nie miałby stabilnej ścieżki do niego; pliki w
         public/ Expo kopiuje 1:1 pod tą samą nazwą). Dzięki temu przejście
         do prawdziwego splasha jest niezauważalne, bez mrugnięcia ani
         zmiany layoutu. Znika samo, czysto przez CSS, w chwili gdy React
         cokolwiek wstawi do #root — nie trzeba go usuwać z JS, i zostaje
         widoczne nieprzerwanie aż do tego momentu (nie ma progu
         czasowego/fade-out tutaj celowo). -->
    <style id="static-splash-styles">
      #static-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
      }
      #static-splash-logo {
        width: 340px;
        aspect-ratio: 752 / 509;
        object-fit: contain;
        filter: drop-shadow(0 6px 18px rgba(31, 107, 255, 0.16));
      }
      #root:not(:empty) ~ #static-splash {
        display: none;
      }
      #static-splash-runner {
        margin-top: 28px;
        width: 44px;
        height: 44px;
      }
      #static-splash-shadow {
        margin-top: 6px;
        width: 31px;
        height: 8px;
        border-radius: 999px;
        background: #0a0e16;
        opacity: 0.18;
      }
      /* Dokładnie ta sama animacja co loading-runner.tsx —
         2026-08-17 (siódma runda): "on jakby skakał" — poprzednie
         steps(1)/opacity-swap między dwiema statycznymi klatkami zawsze
         wygląda jak teleportowanie, nie bieg. Zamienione na PŁYNNE
         tweenowanie współrzędnych każdego stawu z osobna (CSS `d: path()` i
         `cx`/`cy` są animowalne, o ile oba stany mają tę samą liczbę i typ
         komend — tu zawsze M+L, więc działa), tam i z powrotem w pętli
         (ease-in-out, alternate) — dokładnie ten sam mechanizm co
         `interpolate()` w loading-runner.tsx. Głowa+tułów nadal statyczne.
         Bez wsparcia dla animowanego `d` (starsze silniki) element po
         prostu zostaje w pozycji bazowej (klatka A) — nieruchomy, ale wciąż
         poprawna, czytelna sylwetka biegacza, nie zepsuty layout. */
      #static-splash-runner .leg1 {
        d: path('M17 25L26 32L34 42');
        animation: static-leg1 260ms ease-in-out infinite alternate;
      }
      #static-splash-runner .leg1-cap {
        cx: 34px;
        cy: 42px;
        animation: static-leg1-cap 260ms ease-in-out infinite alternate;
      }
      #static-splash-runner .leg2 {
        d: path('M17 25L10 33L4 40');
        animation: static-leg2 260ms ease-in-out infinite alternate;
      }
      #static-splash-runner .leg2-cap {
        cx: 4px;
        cy: 40px;
        animation: static-leg2-cap 260ms ease-in-out infinite alternate;
      }
      #static-splash-runner .arm1 {
        d: path('M23 12L35 15');
        animation: static-arm1 260ms ease-in-out infinite alternate;
      }
      #static-splash-runner .arm1-cap {
        cx: 35px;
        cy: 15px;
        animation: static-arm1-cap 260ms ease-in-out infinite alternate;
      }
      #static-splash-runner .arm2 {
        d: path('M23 12L6 19');
        animation: static-arm2 260ms ease-in-out infinite alternate;
      }
      #static-splash-runner .arm2-cap {
        cx: 6px;
        cy: 19px;
        animation: static-arm2-cap 260ms ease-in-out infinite alternate;
      }
      @keyframes static-leg1 {
        to {
          d: path('M17 25L25 29L23 38');
        }
      }
      @keyframes static-leg1-cap {
        to {
          cx: 23px;
          cy: 38px;
        }
      }
      @keyframes static-leg2 {
        to {
          d: path('M17 25L9 23L11 31');
        }
      }
      @keyframes static-leg2-cap {
        to {
          cx: 11px;
          cy: 31px;
        }
      }
      @keyframes static-arm1 {
        to {
          d: path('M23 12L8 16');
        }
      }
      @keyframes static-arm1-cap {
        to {
          cx: 8px;
          cy: 16px;
        }
      }
      @keyframes static-arm2 {
        to {
          d: path('M23 12L34 18');
        }
      }
      @keyframes static-arm2-cap {
        to {
          cx: 34px;
          cy: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #static-splash-runner .leg1,
        #static-splash-runner .leg1-cap,
        #static-splash-runner .leg2,
        #static-splash-runner .leg2-cap,
        #static-splash-runner .arm1,
        #static-splash-runner .arm1-cap,
        #static-splash-runner .arm2,
        #static-splash-runner .arm2-cap {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="static-splash">
      <img id="static-splash-logo" src="/splash-logo.png" alt="" />
      <svg id="static-splash-runner" viewBox="0 0 48 48">
        <circle cx="24" cy="6" r="4" fill="#1f6bff" />
        <path d="M23 12 L17 25" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" fill="none" />
        <path class="leg1" d="M17 25 L26 32 L34 42" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle class="leg1-cap" cx="34" cy="42" r="2.3" fill="#1f6bff" />
        <path class="leg2" d="M17 25 L10 33 L4 40" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle class="leg2-cap" cx="4" cy="40" r="2.3" fill="#1f6bff" />
        <path class="arm1" d="M23 12 L35 15" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" fill="none" />
        <circle class="arm1-cap" cx="35" cy="15" r="2" fill="#1f6bff" />
        <path class="arm2" d="M23 12 L6 19" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" fill="none" />
        <circle class="arm2-cap" cx="6" cy="19" r="2" fill="#1f6bff" />
      </svg>
      <div id="static-splash-shadow"></div>
    </div>
  </body>
</html>
