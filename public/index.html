<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: bez tego env(safe-area-inset-*) zawsze zwraca 0 na
         iPhone z wcięciem/paskiem gestów — react-native-safe-area-context na
         webie liczy na te zmienne CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#1f6bff" />

    <!-- Uruchomienie z ekranu głównego iOS (Dodaj do ekranu głównego) jako
         samodzielna appka, bez paska adresu Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DUDIE DAY" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Statyczny (czysty HTML/CSS, zero JS) ekran ładowania — #root jest
         PUSTY dopóki nie doładuje się i wykona cały bundle (kilka MB, patrz
         zgłoszenie 2026-08-16 "boisk długo się ładuje" — bez tego użytkownik
         przez ten cały czas patrzy na białą, pustą stronę, zanim React w
         ogóle zdąży zamontować właściwy splash z biegaczem z LoadingRunner,
         patrz src/app/_layout.tsx i src/components/loading-runner.tsx). TEN
         SAM rysunek (prosta sylwetka biegacza, kolor marki) i TA SAMA
         animacja co LoadingRunner (2026-08-17, trzecia runda: głowa+tułów
         statyczne, tylko nogi/ręce skaczą dyskretnie między parą "wykrok" /
         "kolano uniesione" — patrz komentarz przy #static-splash-runner
         niżej i loading-runner.tsx). TEN SAM layout co React splash (logo, potem pod nim
         biegacz) — biegacz ma być ZAWSZE pod logiem DUDIE DAY, nie najpierw
         sam biegacz a dopiero potem logo, więc logo musi być tutaj od razu,
         nie dopiero w React. Logo skopiowane do public/splash-logo.png (nie
         assets/images/ — Expo haszuje nazwy plików z assets/ przy buildzie,
         więc statyczny HTML nie miałby stabilnej ścieżki do niego; pliki w
         public/ Expo kopiuje 1:1 pod tą samą nazwą). Dzięki temu przejście
         do prawdziwego splasha jest niezauważalne, bez mrugnięcia ani
         zmiany layoutu. Znika samo, czysto przez CSS, w chwili gdy React
         cokolwiek wstawi do #root — nie trzeba go usuwać z JS, i zostaje
         widoczne nieprzerwanie aż do tego momentu (nie ma progu
         czasowego/fade-out tutaj celowo). -->
    <style id="static-splash-styles">
      #static-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
      }
      #static-splash-logo {
        width: 340px;
        aspect-ratio: 752 / 509;
        object-fit: contain;
        filter: drop-shadow(0 6px 18px rgba(31, 107, 255, 0.16));
      }
      #root:not(:empty) ~ #static-splash {
        display: none;
      }
      #static-splash-runner {
        margin-top: 28px;
        width: 44px;
        height: 44px;
      }
      #static-splash-shadow {
        margin-top: 6px;
        width: 31px;
        height: 8px;
        border-radius: 999px;
        background: #0a0e16;
        opacity: 0.18;
      }
      /* Dokładnie ta sama animacja co loading-runner.tsx —
         2026-08-17 (czwarta runda, po renderze przez sharp/rsvg — patrz
         komentarz w loading-runner.tsx): głowa+tułów (circle + statyczny
         <path> nad .frame-a/.frame-b) nigdy się nie ruszają/nie odbijają.
         Rusza się WYŁĄCZNIE para noga+ręka, dyskretnie (steps(1), bez
         płynnego przejścia) między dwiema kluczowymi pozycjami biegu:
         .frame-a = "wykrok" (obie stopy przy ziemi, przód-tył), .frame-b =
         "kolano uniesione" (noga podporowa NADAL sięga tej samej linii
         gruntu co w klatce A, tylko noga swobodna ma kolano w górze) — tak,
         żeby sylwetka nie "podskakiwała" wizualnie między klatkami. Cień
         statyczny.
         2026-08-17 (piąta runda): ręce miały w klatce A/B prawie identyczne
         współrzędne dłoni (różnica 1-2px) — wizualnie stały w miejscu,
         biegły tylko nogi. Teraz ręce mają taki sam duży wymach jak nogi,
         naprzemienny między klatkami.
         2026-08-17 (szósta runda): wg referencyjnego obrazka od
         użytkownika, noga z tyłu w klatce B to teraz "heel kick" (pięta
         podkurzona w górę-tył, kolano blisko bioder), nie uniesione wysoko
         kolano z przodu jak wcześniej — plus kropki (pięści/stopy) na
         końcach kończyn dla czytelności. */
      #static-splash-runner .frame-a {
        animation: static-splash-frame-a 400ms steps(1) infinite;
      }
      #static-splash-runner .frame-b {
        animation: static-splash-frame-b 400ms steps(1) infinite;
      }
      @keyframes static-splash-frame-a {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      @keyframes static-splash-frame-b {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #static-splash-runner .frame-a,
        #static-splash-runner .frame-b {
          animation: none;
        }
        #static-splash-runner .frame-b {
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="static-splash">
      <img id="static-splash-logo" src="/splash-logo.png" alt="" />
      <svg id="static-splash-runner" viewBox="0 0 48 48">
        <circle cx="24" cy="6" r="4" fill="#1f6bff" />
        <path d="M23 12 L17 25" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" fill="none" />
        <g class="frame-a">
          <path d="M17 25 L26 32 L34 42" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <circle cx="34" cy="42" r="2.3" fill="#1f6bff" />
          <path d="M17 25 L4 40" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" fill="none" />
          <circle cx="4" cy="40" r="2.3" fill="#1f6bff" />
          <path d="M23 12 L35 15" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" fill="none" />
          <circle cx="35" cy="15" r="2" fill="#1f6bff" />
          <path d="M23 12 L6 19" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" fill="none" />
          <circle cx="6" cy="19" r="2" fill="#1f6bff" />
        </g>
        <g class="frame-b">
          <path d="M17 25 L25 29 L23 38" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <circle cx="23" cy="38" r="2.3" fill="#1f6bff" />
          <path d="M17 25 L9 23 L11 31" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <circle cx="11" cy="31" r="2.3" fill="#1f6bff" />
          <path d="M23 12 L8 16" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" fill="none" />
          <circle cx="8" cy="16" r="2" fill="#1f6bff" />
          <path d="M23 12 L34 18" stroke="#1f6bff" stroke-width="4" stroke-linecap="round" fill="none" />
          <circle cx="34" cy="18" r="2" fill="#1f6bff" />
        </g>
      </svg>
      <div id="static-splash-shadow"></div>
    </div>
  </body>
</html>
