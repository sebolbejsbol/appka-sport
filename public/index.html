<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: bez tego env(safe-area-inset-*) zawsze zwraca 0 na
         iPhone z wcięciem/paskiem gestów — react-native-safe-area-context na
         webie liczy na te zmienne CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#1f6bff" />

    <!-- Uruchomienie z ekranu głównego iOS (Dodaj do ekranu głównego) jako
         samodzielna appka, bez paska adresu Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DUDIE DAY" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Statyczny (czysty HTML/CSS, zero JS) ekran ładowania — #root jest
         PUSTY dopóki nie doładuje się i wykona cały bundle (kilka MB, patrz
         zgłoszenie 2026-08-16 "boisk długo się ładuje" — bez tego użytkownik
         przez ten cały czas patrzy na białą, pustą stronę, zanim React w
         ogóle zdąży zamontować właściwy splash z biegaczem z LoadingRunner,
         patrz src/app/_layout.tsx i src/components/loading-runner.tsx). TEN
         SAM glif (Material Symbols "directions_run", kolor marki) i TA SAMA
         krzywa ruchu co LoadingRunner — tam pozycja liczy się jako funkcja
         trygonometryczna ciągłego postępu t (sin, nie 2-3-punktowa sekwencja
         klatek kluczowych, stąd płynniej/bardziej "biegowo" niż odbijanie
         piłki), tu 9 próbek tej samej krzywej co CSS @keyframes potrafi
         obsłużyć bez JS. TEN SAM layout co React splash (logo, potem pod
         nim biegacz) — zgłoszenie 2026-08-16: biegacz ma być ZAWSZE pod
         logiem DUDIE DAY, nie najpierw sam biegacz a dopiero potem logo,
         więc logo musi być tutaj od razu, nie dopiero w React. Logo
         skopiowane do public/splash-logo.png (nie assets/images/ — Expo
         haszuje nazwy plików z assets/ przy buildzie, więc statyczny HTML
         nie miałby stabilnej ścieżki do niego; pliki w public/ Expo kopiuje
         1:1 pod tą samą nazwą). Dzięki temu przejście do prawdziwego
         splasha jest niezauważalne, bez mrugnięcia ani zmiany layoutu.
         Znika samo, czysto przez CSS, w chwili gdy React cokolwiek wstawi
         do #root — nie trzeba go usuwać z JS, i zostaje widoczne
         nieprzerwanie aż do tego momentu (nie ma progu czasowego/fade-out
         tutaj celowo). -->
    <style id="static-splash-styles">
      #static-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
      }
      #static-splash-logo {
        width: 280px;
        aspect-ratio: 752 / 509;
        object-fit: contain;
      }
      #root:not(:empty) ~ #static-splash {
        display: none;
      }
      #static-splash-runner-stage {
        margin-top: 28px;
        position: relative;
        width: 44px;
        height: 44px;
      }
      #static-splash-runner {
        width: 44px;
        height: 44px;
        animation: static-splash-run 720ms linear infinite;
      }
      #static-splash-speed-lines {
        position: absolute;
        right: 100%;
        bottom: 10px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        margin-right: 4px;
        animation: static-splash-speed-lines 720ms linear infinite;
      }
      #static-splash-speed-lines span {
        display: block;
        height: 3px;
        border-radius: 999px;
        background: #9ec0ff;
      }
      #static-splash-speed-lines span:nth-child(1) {
        width: 18px;
      }
      #static-splash-speed-lines span:nth-child(2) {
        width: 12px;
      }
      #static-splash-speed-lines span:nth-child(3) {
        width: 15px;
      }
      #static-splash-shadow {
        margin-top: 6px;
        width: 31px;
        height: 8px;
        border-radius: 999px;
        background: #0a0e16;
        animation: static-splash-shadow 720ms linear infinite;
      }
      /* 9 próbek (co 12.5%) DOKŁADNIE tej samej krzywej co runnerStyle w
         loading-runner.tsx: bounce = |sin(t*pi)|, stride = sin(t*2*pi),
         translateY = -bounce*0.3*44, translateX = stride*0.05*44,
         rotate = stride*10deg, scaleX = stride>=0 ? 1 : -1 (przełącznik
         lustrzany dokładnie w neutralnym momencie kroku — ta sama sztuczka
         "na przemian pracujących nóg" z jednej asymetrycznej sylwetki). */
      @keyframes static-splash-run {
        0% {
          transform: translateY(0) translateX(0) rotate(0deg) scaleX(1);
        }
        12.5% {
          transform: translateY(-5.1px) translateX(1.6px) rotate(7.1deg) scaleX(1);
        }
        25% {
          transform: translateY(-9.3px) translateX(2.2px) rotate(10deg) scaleX(1);
        }
        37.5% {
          transform: translateY(-12.2px) translateX(1.6px) rotate(7.1deg) scaleX(1);
        }
        50% {
          transform: translateY(-13.2px) translateX(0) rotate(0deg) scaleX(1);
        }
        62.5% {
          transform: translateY(-12.2px) translateX(-1.6px) rotate(-7.1deg) scaleX(-1);
        }
        75% {
          transform: translateY(-9.3px) translateX(-2.2px) rotate(-10deg) scaleX(-1);
        }
        87.5% {
          transform: translateY(-5.1px) translateX(-1.6px) rotate(-7.1deg) scaleX(-1);
        }
        100% {
          transform: translateY(0) translateX(0) rotate(0deg) scaleX(1);
        }
      }
      /* Cień i smugi prędkości: obie napędzane tą samą "bounce" co powyżej
         (opacity/scale cienia = 0.24-bounce*0.12 / 1-bounce*0.38, smugi =
         0.15+bounce*0.35 / -bounce*0.16*44) — najintensywniejsze dokładnie
         gdy biegacz jest najwyżej, tak jak w loading-runner.tsx. */
      @keyframes static-splash-shadow {
        0% {
          opacity: 0.24;
          transform: scaleX(1);
        }
        12.5% {
          opacity: 0.194;
          transform: scaleX(0.855);
        }
        25% {
          opacity: 0.155;
          transform: scaleX(0.731);
        }
        37.5% {
          opacity: 0.129;
          transform: scaleX(0.649);
        }
        50% {
          opacity: 0.12;
          transform: scaleX(0.62);
        }
        62.5% {
          opacity: 0.129;
          transform: scaleX(0.649);
        }
        75% {
          opacity: 0.155;
          transform: scaleX(0.731);
        }
        87.5% {
          opacity: 0.194;
          transform: scaleX(0.855);
        }
        100% {
          opacity: 0.24;
          transform: scaleX(1);
        }
      }
      @keyframes static-splash-speed-lines {
        0% {
          opacity: 0.15;
          transform: translateX(0);
        }
        12.5% {
          opacity: 0.284;
          transform: translateX(-2.7px);
        }
        25% {
          opacity: 0.397;
          transform: translateX(-5px);
        }
        37.5% {
          opacity: 0.473;
          transform: translateX(-6.5px);
        }
        50% {
          opacity: 0.5;
          transform: translateX(-7px);
        }
        62.5% {
          opacity: 0.473;
          transform: translateX(-6.5px);
        }
        75% {
          opacity: 0.397;
          transform: translateX(-5px);
        }
        87.5% {
          opacity: 0.284;
          transform: translateX(-2.7px);
        }
        100% {
          opacity: 0.15;
          transform: translateX(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #static-splash-runner,
        #static-splash-shadow,
        #static-splash-speed-lines {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="static-splash">
      <img id="static-splash-logo" src="/splash-logo.png" alt="" />
      <div id="static-splash-runner-stage">
        <div id="static-splash-speed-lines">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <svg id="static-splash-runner" viewBox="0 -960 960 960">
          <path
            fill="#1f6bff"
            d="M535-70v-209l-108-99-36 159q-3 12-13 18.5t-22 4.5l-208-43q-11-2-18-12t-5-22q2-12 12.5-18t21.5-4l171 34 73-369-100 47v104q0 13-8.5 21.5T273-449q-13 0-21.5-8.5T243-479v-125q0-9 5-16.5t13-11.5l146-61q32-14 45.5-17.5T480-714q20 0 35.5 8.5T542-680l42 67q23 37 60 65.5t86 36.5q13 2 21.5 10.5T760-479q0 12-8.5 21t-20.5 7q-57-6-102.5-36.5T543-573l-39 158 81 75q5 5 7.5 10.5T595-318v248q0 13-8.5 21.5T565-40q-13 0-21.5-8.5T535-70Zm-46.5-705.5Q467-797 467-827t21.5-51.5Q510-900 540-900t51.5 21.5Q613-857 613-827t-21.5 51.5Q570-754 540-754t-51.5-21.5Z"
          />
        </svg>
      </div>
      <div id="static-splash-shadow"></div>
    </div>
  </body>
</html>
