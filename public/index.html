<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: bez tego env(safe-area-inset-*) zawsze zwraca 0 na
         iPhone z wcięciem/paskiem gestów — react-native-safe-area-context na
         webie liczy na te zmienne CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#1f6bff" />

    <!-- Uruchomienie z ekranu głównego iOS (Dodaj do ekranu głównego) jako
         samodzielna appka, bez paska adresu Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DUDIE DAY" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Statyczny (czysty HTML/CSS, zero JS) ekran ładowania — #root jest
         PUSTY dopóki nie doładuje się i wykona cały bundle (kilka MB, patrz
         zgłoszenie 2026-08-16 "boisk długo się ładuje" — bez tego użytkownik
         przez ten cały czas patrzy na białą, pustą stronę, zanim React w
         ogóle zdąży zamontować właściwy splash z biegaczem z LoadingRunner,
         patrz src/app/_layout.tsx i src/components/loading-runner.tsx). TEN
         SAM glif (Material Symbols "directions_run", kolor marki) i TA SAMA
         krzywa ruchu co LoadingRunner — tam pozycja liczy się jako funkcja
         trygonometryczna ciągłego postępu t (sin, nie 2-3-punktowa sekwencja
         klatek kluczowych, stąd płynniej/bardziej "biegowo" niż odbijanie
         piłki), tu 9 próbek tej samej krzywej co CSS @keyframes potrafi
         obsłużyć bez JS. Dzięki temu przejście do prawdziwego splasha jest
         niezauważalne, bez mrugnięcia ani zmiany stylu ruchu. Znika samo,
         czysto przez CSS, w chwili gdy React cokolwiek wstawi do #root —
         nie trzeba go usuwać z JS, i zostaje widoczne nieprzerwanie aż do
         tego momentu (nie ma progu czasowego/fade-out tutaj celowo). -->
    <style id="static-splash-styles">
      #static-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
      }
      #root:not(:empty) ~ #static-splash {
        display: none;
      }
      #static-splash-runner {
        margin-top: 28px;
        width: 44px;
        height: 44px;
        animation: static-splash-run 900ms linear infinite;
      }
      #static-splash-shadow {
        margin-top: 6px;
        width: 31px;
        height: 8px;
        border-radius: 999px;
        background: #0a0e16;
        animation: static-splash-shadow 900ms linear infinite;
      }
      /* 9 próbek (co 12.5%) krzywej translateY = -sin(t*pi)*0.26*44,
         translateX = sin(t*2*pi)*0.05*44, rotate = sin(t*2*pi)*10deg —
         dokładnie ta sama funkcja co runnerStyle w loading-runner.tsx. */
      @keyframes static-splash-run {
        0% {
          transform: translateY(0) translateX(0) rotate(0deg);
        }
        12.5% {
          transform: translateY(-4.2px) translateX(2.2px) rotate(10deg);
        }
        25% {
          transform: translateY(-7.8px) translateX(0) rotate(0deg);
        }
        37.5% {
          transform: translateY(-10.2px) translateX(-2.2px) rotate(-10deg);
        }
        50% {
          transform: translateY(-11px) translateX(0) rotate(0deg);
        }
        62.5% {
          transform: translateY(-10.2px) translateX(2.2px) rotate(10deg);
        }
        75% {
          transform: translateY(-7.8px) translateX(0) rotate(0deg);
        }
        87.5% {
          transform: translateY(-4.2px) translateX(-2.2px) rotate(-10deg);
        }
        100% {
          transform: translateY(0) translateX(0) rotate(0deg);
        }
      }
      /* Cień: opacity/scaleX = 0.24-bounce*0.12 / 1-bounce*0.38, ta sama
         "bounce" (|sin(t*pi)|) co powyżej — najniższy i najwęższy dokładnie
         gdy biegacz jest najwyżej. */
      @keyframes static-splash-shadow {
        0% {
          opacity: 0.24;
          transform: scaleX(1);
        }
        12.5% {
          opacity: 0.195;
          transform: scaleX(0.855);
        }
        25% {
          opacity: 0.155;
          transform: scaleX(0.731);
        }
        37.5% {
          opacity: 0.129;
          transform: scaleX(0.649);
        }
        50% {
          opacity: 0.12;
          transform: scaleX(0.62);
        }
        62.5% {
          opacity: 0.129;
          transform: scaleX(0.649);
        }
        75% {
          opacity: 0.155;
          transform: scaleX(0.731);
        }
        87.5% {
          opacity: 0.195;
          transform: scaleX(0.855);
        }
        100% {
          opacity: 0.24;
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #static-splash-runner,
        #static-splash-shadow {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="static-splash">

        />
      </svg>
      <div id="static-splash-shadow"></div>
    </div>
  </body>
</html>
